name: Wire programme chainage
on:
  push:
    branches: [main]
    paths:
      - public/schedule.js
      - public/program-chainage.js
      - scripts/inject-schedule.mjs
      - scripts/test-schedule.mjs
      - scripts/test-program-chainage.mjs
      - .github/workflows/inject-schedule.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-and-wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: |
          node --check public/schedule.js
          node --check public/program-chainage.js
      - name: Schedule unit tests
        run: node scripts/test-schedule.mjs
      - name: Programme chainage unit tests
        run: node scripts/test-program-chainage.mjs
      - name: Wire scripts into site
        run: node scripts/inject-schedule.mjs
      - name: Verify site entry point
        run: |
          grep -F '<script src="schedule.js"></script>' public/index.html
          grep -F '<script src="program-chainage.js"></script>' public/index.html
          if grep -Fq '<script src="schedule-menu.js"></script>' public/index.html; then
            echo 'Old dropdown script is still present'
            exit 1
          fi
      - name: Commit wiring if needed
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "wire programme chainage tab into site"
          git push
